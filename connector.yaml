version: "1.0"
specification:
  name: postgres
  summary: Conduit connector for PostgreSQL
  description: |
    ## Source

    The Postgres Source Connector connects to a database with the provided `url` and
    starts creating records for each change detected in the provided tables.

    Upon starting, the source takes a snapshot of the provided tables in the database,
    then switches into CDC mode. In CDC mode, the plugin reads from a buffer of CDC events.

    ### Snapshot

    When the connector first starts, snapshot mode is enabled. The connector acquires
    a read-only lock on the tables, and then reads all rows of the tables into Conduit.
    Once all rows in that initial snapshot are read the connector releases its lock and
    switches into CDC mode.

    This behavior is enabled by default, but can be turned off by adding
    `"snapshotMode": "never"` to the Source configuration.

    ### Change Data Capture

    This connector implements Change Data Capture (CDC) features for PostgreSQL by
    creating a logical replication slot and a publication that listens to changes in the
    configured tables. Every detected change is converted into a record. If there are no
    records available, the connector blocks until a record is available or the connector
    receives a stop signal.

    #### Logical Replication Configuration

    When the connector switches to CDC mode, it attempts to run the initial setup commands
    to create its logical replication slot and publication. It will connect to an existing
    slot if one with the configured name exists.

    The Postgres user specified in the connection URL must have sufficient privileges to
    run all of these setup commands, or it will fail.

    Example pipeline configuration that's using logical replication:

    ```yaml
    version: 2.2
    pipelines:
      - id: pg-to-log
        status: running
        connectors:
          - id: pg
            type: source
            plugin: builtin:postgres
            settings:
              url: "postgres://exampleuser:examplepass@localhost:5433/exampledb?sslmode=disable"
              tables: "users"
              cdcMode: "logrepl"
              logrepl.publicationName: "examplepub"
              logrepl.slotName: "exampleslot"
          - id: log
            type: destination
            plugin: builtin:log
            settings:
              level: info
    ```

    :warning: When the connector or pipeline is deleted, the connector will automatically
    attempt to delete the replication slot and publication. This is the default behaviour
    and can be disabled by setting `logrepl.autoCleanup` to `false`.

    #### Heartbeats

    With `logrepl.heartbeat.enabled: "true"`, once CDC is streaming the connector
    upserts one row per replication slot into a heartbeat table
    (`public._conduit_heartbeat` by default) every `logrepl.heartbeat.interval`
    (default `30s`). On start it creates the table if it is missing and adds it to the
    connector's publication, so every write comes back through the replication stream.
    Heartbeat changes are never emitted as records.

    What it gives you:

    - **A delivery check.** A heartbeat arriving proves the connector can write, the
      publication still contains the table, and Postgres is delivering changes. If no
      heartbeat arrives for three intervals, the connector logs
      `postgres.heartbeat.stale` and says whether the writes themselves are failing. A
      failed write logs `postgres.heartbeat.write_failed`; it is not retried.
    - **A second way to advance the slot.** While no emitted record is waiting for an
      ack, the connector may confirm the heartbeat's WAL position to Postgres, which
      lets the server discard older WAL. It never confirms a position past a record
      that has not been acked.

    The connector already confirms the server's WAL position from keepalive messages
    when nothing is in flight, so an idle publication does not pin the slot even with
    heartbeats off.

    Requirements: `CREATE` on the heartbeat schema (or create the table yourself),
    `INSERT`, `UPDATE` and `SELECT` on the table, and ownership of the table and the
    publication unless the publication already contains the table. Setup failures stop
    the connector at start with `postgres.heartbeat.setup_failed`.

    While heartbeats are enabled the heartbeat table is reserved: `tables: "*"` skips
    it, and listing it in `tables` is a configuration error. Disabling heartbeats
    leaves the table and its publication membership in place. If you no longer need
    them, run `ALTER PUBLICATION <publication> DROP TABLE <schema>.<table>` and drop
    the table; otherwise a later `tables: "*"`, or another connector still writing to
    the table, makes its rows show up as records. Do the same when rolling back to a
    connector version without heartbeats.

    :warning: **Running next to Debezium.** Debezium's Postgres connector heartbeats
    through `heartbeat.action.query`, usually into its own table (for example
    `debezium_heartbeat`). Do not set `logrepl.heartbeat.table` to Debezium's heartbeat
    table, or the other way round: each would count the other's writes as its own, and
    staleness would go unnoticed. If both connectors use the same publication, or
    Debezium uses a `FOR ALL TABLES` publication, each one receives the other's
    heartbeat changes as data. Give each connector its own publication, and exclude the
    other's heartbeat table (`table.exclude.list` in Debezium; leave it out of `tables`
    here).

    ### Key Handling

    The connector will automatically look up the primary key column for the specified tables
    and use them as the key value. If that can't be determined, the connector will return
    an error.

    ### Unchanged TOASTed Columns

    Postgres stores large field values (`text`, `bytea`, `jsonb`, and other
    variable-length types past a size threshold) out-of-line using
    [TOAST](https://www.postgresql.org/docs/current/storage-toast.html). When a row is
    updated but a TOASTed column is **not** changed, Postgres omits that column's value
    from the logical-replication message to avoid re-transmitting large unchanged data.

    For such columns, this connector **omits the field from the record payload** rather
    than emitting it as `NULL`. Emitting `NULL` would be silent data corruption — a
    downstream sink cannot distinguish "the value was set to NULL" from "the value did
    not change". Omission preserves that distinction: absence means "unchanged".

    What this means for your destination:

    - **Partial-update / upsert sinks** (including this connector's own Postgres
      destination, which builds its `ON CONFLICT DO UPDATE SET` clause only from the
      fields present in the payload) handle omission correctly — an absent field is left
      untouched in the target row.
    - **Full-row / full-document replace sinks** must treat an absent field as
      "unchanged" and preserve the existing target value. If a sink cannot do this, set
      `REPLICA IDENTITY FULL` on the source table. Under `REPLICA IDENTITY FULL` the old
      row image carries every column, and this connector backfills unchanged TOASTed
      values from it so the payload is always complete.

    ## Destination

    The Postgres Destination takes a Conduit record and stores it using a SQL statement.
    The Destination is designed to handle different payloads and keys. Because of this,
    each record is individually parsed and upserted.

    ### Handling record operations

    Based on the `Operation` field in the record, the destination will either insert,
    update or delete the record in the target table. Snapshot records are always inserted.

    If the target table already contains a record with the same key as a record being
    inserted, the record will be updated (upserted). This can overwrite and thus potentially
    lose data, so keys should be assigned correctly from the Source.

    If the target table does not contain a record with the same key as a record being
    deleted, the record will be ignored.

    If there is no key, the record will be simply appended.
  version: v0.14.2
  author: Meroxa, Inc.
  source:
    parameters:
      - name: tables
        description: |-
          Tables is a List of table names to read from, separated by a comma, e.g.:"table1,table2".
          Use "*" if you'd like to listen to all tables.
        type: string
        default: ""
        validations:
          - type: required
            value: ""
      - name: url
        description: URL is the connection string for the Postgres database.
        type: string
        default: ""
        validations:
          - type: required
            value: ""
      - name: cdcMode
        description: CDCMode determines how the connector should listen to changes.
        type: string
        default: auto
        validations:
          - type: inclusion
            value: auto,logrepl
      - name: logrepl.autoCleanup
        description: |-
          LogreplAutoCleanup determines if the replication slot and publication should be
          removed when the connector is deleted.
        type: bool
        default: "true"
        validations: []
      - name: logrepl.heartbeat.enabled
        description: |-
          LogreplHeartbeatEnabled turns on the heartbeat (DBZ-3 B2): once CDC is
          streaming, the connector upserts a row for its replication slot into
          the heartbeat table every logrepl.heartbeat.interval. The table is added
          to the publication, so each write comes back through the replication
          stream and proves the stream is delivering. Heartbeat changes are never
          emitted as records. Requires CREATE on the heartbeat schema (or a
          pre-created table), INSERT/UPDATE/SELECT on the table, and ownership of
          the table and the publication unless the publication already contains
          the table.
        type: bool
        default: "false"
        validations: []
      - name: logrepl.heartbeat.interval
        description: LogreplHeartbeatInterval is the time between heartbeat writes.
        type: duration
        default: 30s
        validations: []
      - name: logrepl.heartbeat.schema
        description: LogreplHeartbeatSchema is the schema of the heartbeat table.
        type: string
        default: public
        validations: []
      - name: logrepl.heartbeat.table
        description: |-
          LogreplHeartbeatTable is the name of the heartbeat table. Must not be
          one of the source tables, and must not be another tool's heartbeat
          table (for example Debezium's).
        type: string
        default: _conduit_heartbeat
        validations: []
      - name: logrepl.publicationName
        description: |-
          LogreplPublicationName determines the publication name in case the
          connector uses logical replication to listen to changes (see CDCMode).
        type: string
        default: conduitpub
        validations: []
      - name: logrepl.schemaDrift.policy
        description: |-
          LogreplSchemaDriftPolicy determines how the connector handles schema
          drift (a DDL that changes a table's shape during CDC; DBZ-3 B1):
            - "halt" (default): emit a drift marker record, checkpoint before it,
              and stop with a terminal error until the pipeline is restarted to
              approve the change.
            - "evolve": accept additive changes silently; incompatible (narrowing)
              changes still halt.
          "dlq" is reserved for a future version and rejected at validation.
        type: string
        default: halt
        validations: []
      - name: logrepl.slotName
        description: |-
          LogreplSlotName determines the replication slot name in case the
          connector uses logical replication to listen to changes (see CDCMode).
          Can only contain lower-case letters, numbers, and the underscore character.
        type: string
        default: conduitslot
        validations:
          - type: regex
            value: ^[a-z0-9_]+$
      - name: logrepl.withAvroSchema
        description: |-
          WithAvroSchema determines whether the connector should attach an avro schema on each
          record.
        type: bool
        default: "true"
        validations: []
      - name: snapshot.fetchSize
        description: Snapshot fetcher size determines the number of rows to retrieve at a time.
        type: int
        default: "50000"
        validations: []
      - name: snapshotMode
        description: SnapshotMode is whether the plugin will take a snapshot of the entire table before starting cdc mode.
        type: string
        default: initial
        validations:
          - type: inclusion
            value: initial,never
      - name: sdk.batch.delay
        description: Maximum delay before an incomplete batch is read from the source.
        type: duration
        default: "0"
        validations: []
      - name: sdk.batch.size
        description: Maximum size of batch before it gets read from the source.
        type: int
        default: "0"
        validations:
          - type: greater-than
            value: "-1"
      - name: sdk.schema.context.enabled
        description: |-
          Specifies whether to use a schema context name. If set to false, no schema context name will
          be used, and schemas will be saved with the subject name specified in the connector
          (not safe because of name conflicts).
        type: bool
        default: "true"
        validations: []
      - name: sdk.schema.context.name
        description: |-
          Schema context name to be used. Used as a prefix for all schema subject names.
          If empty, defaults to the connector ID.
        type: string
        default: ""
        validations: []
      - name: sdk.schema.extract.key.enabled
        description: Whether to extract and encode the record key with a schema.
        type: bool
        default: "false"
        validations: []
      - name: sdk.schema.extract.key.subject
        description: |-
          The subject of the key schema. If the record metadata contains the field
          "opencdc.collection" it is prepended to the subject name and separated
          with a dot.
        type: string
        default: key
        validations: []
      - name: sdk.schema.extract.payload.enabled
        description: Whether to extract and encode the record payload with a schema.
        type: bool
        default: "false"
        validations: []
      - name: sdk.schema.extract.payload.subject
        description: |-
          The subject of the payload schema. If the record metadata contains the
          field "opencdc.collection" it is prepended to the subject name and
          separated with a dot.
        type: string
        default: payload
        validations: []
      - name: sdk.schema.extract.type
        description: The type of the payload schema.
        type: string
        default: avro
        validations:
          - type: inclusion
            value: avro
  destination:
    parameters:
      - name: url
        description: URL is the connection string for the Postgres database.
        type: string
        default: ""
        validations:
          - type: required
            value: ""
      - name: table
        description: Table is used as the target table into which records are inserted.
        type: string
        default: '{{ index .Metadata "opencdc.collection" }}'
        validations: []
      - name: sdk.batch.delay
        description: Maximum delay before an incomplete batch is written to the destination.
        type: duration
        default: "0"
        validations: []
      - name: sdk.batch.size
        description: Maximum size of batch before it gets written to the destination.
        type: int
        default: "0"
        validations:
          - type: greater-than
            value: "-1"
      - name: sdk.rate.burst
        description: |-
          Allow bursts of at most X records (0 or less means that bursts are not
          limited). Only takes effect if a rate limit per second is set. Note that
          if `sdk.batch.size` is bigger than `sdk.rate.burst`, the effective batch
          size will be equal to `sdk.rate.burst`.
        type: int
        default: "0"
        validations:
          - type: greater-than
            value: "-1"
      - name: sdk.rate.perSecond
        description: Maximum number of records written per second (0 means no rate limit).
        type: float
        default: "0"
        validations:
          - type: greater-than
            value: "-1"
      - name: sdk.record.format
        description: |-
          The format of the output record. See the Conduit documentation for a full
          list of supported formats (https://conduit.io/docs/using/connectors/configuration-parameters/output-format).
        type: string
        default: opencdc/json
        validations: []
      - name: sdk.record.format.options
        description: |-
          Options to configure the chosen output record format. Options are normally
          key=value pairs separated with comma (e.g. opt1=val2,opt2=val2), except
          for the `template` record format, where options are a Go template.
        type: string
        default: ""
        validations: []
      - name: sdk.schema.extract.key.enabled
        description: Whether to extract and decode the record key with a schema.
        type: bool
        default: "true"
        validations: []
      - name: sdk.schema.extract.payload.enabled
        description: Whether to extract and decode the record payload with a schema.
        type: bool
        default: "true"
        validations: []
