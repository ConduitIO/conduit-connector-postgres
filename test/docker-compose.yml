services:
  pg-0:
    image: docker.io/bitnamilegacy/postgresql-repmgr:17.5.0
    ports:
      - "${PG_TEST_PORT:-5433}:5432"
    volumes:
      - "pg_0_data:/bitnami/postgresql"
      - "./conf.d/:/bitnami/postgresql/conf/conf.d/"
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "meroxadb", "-U", "meroxauser" ]
      timeout: 30s
      interval: 10s
      retries: 5
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=meroxaadmin
      - POSTGRESQL_USERNAME=meroxauser
      - POSTGRESQL_PASSWORD=meroxapass
      - POSTGRESQL_DATABASE=meroxadb
      - REPMGR_USERNAME=repmgr
      - REPMGR_PASSWORD=repmgrmeroxa
      - REPMGR_PRIMARY_HOST=pg-0
      - REPMGR_PRIMARY_PORT=5432
      - REPMGR_PARTNER_NODES=pg-0
      - REPMGR_NODE_NAME=pg-0
      - REPMGR_NODE_NETWORK_NAME=pg-0
      - REPMGR_PORT_NUMBER=5432
  # Transaction pooling with prepared-statement tracking, two server
  # connections: the setup where a statement prepared by one client is handed
  # to another (#436). See BouncerConnString.
  pgbouncer:
    image: docker.io/edoburu/pgbouncer:v1.26.0-p0
    entrypoint: [ "pgbouncer", "/etc/pgbouncer-test/pgbouncer.ini" ]
    ports:
      - "${PGBOUNCER_TEST_PORT:-6432}:6432"
    volumes:
      - "./pgbouncer/:/etc/pgbouncer-test/:ro"
    depends_on:
      pg-0:
        condition: service_healthy
volumes:
  pg_0_data:
    driver: local
