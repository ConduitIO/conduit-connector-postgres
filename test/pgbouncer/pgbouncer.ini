; Test PgBouncer for the destination's pooler tests (BouncerConnString in
; test/helper.go). Transaction pooling, two server connections, and
; prepared-statement tracking: a statement one client prepares on a server
; connection is reused for every client that sends the same SQL text.
[databases]
meroxadb = host=pg-0 port=5432 dbname=meroxadb
; One server connection, so every client of this alias shares it: the tests
; that need a statement one client prepared to reach another use it.
meroxadb_single = host=pg-0 port=5432 dbname=meroxadb pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer-test/userlist.txt
pool_mode = transaction
default_pool_size = 2
max_client_conn = 200
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
