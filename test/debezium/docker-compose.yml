# Stack for the Debezium offset import end-to-end test (test/debezium,
# `make test-debezium`). Run it only through test/debezium/run.sh, which gives
# it a unique compose project name and removes it with `down -v`.
#
# There are no fixed host ports: Postgres and the Kafka Connect REST API are
# published on ephemeral loopback ports, and run.sh hands the addresses to the
# test through DBZ_PG_ADDR and DBZ_CONNECT_URL. Kafka is reachable only inside
# the compose network (the test reads topics with `docker compose exec`).
services:
  pg:
    # quay.io/debezium/postgres has decoderbufs as well as pgoutput.
    image: ${PG_IMAGE:-quay.io/debezium/postgres:16}
    ports:
      - "127.0.0.1::5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=20
      - -c
      - max_wal_senders=20
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "inventory"]
      interval: 1s
      retries: 60
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  connect:
    image: quay.io/debezium/connect:${DBZ_VERSION:-3.2}
    depends_on: [kafka, pg]
    ports:
      - "127.0.0.1::8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: dbz-e2e
      CONFIG_STORAGE_TOPIC: dbz_e2e_configs
      OFFSET_STORAGE_TOPIC: dbz_e2e_offsets
      STATUS_STORAGE_TOPIC: dbz_e2e_statuses
      # Commit offsets often, so an offset taken mid-transaction is visible
      # through GET /connectors/{name}/offsets while the transaction streams.
      OFFSET_FLUSH_INTERVAL_MS: 100
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors >/dev/null"]
      interval: 2s
      retries: 120
