# Captures real Debezium Postgres offsets for the dbzoffset fixtures. See
# capture.sh. No fixed host ports: Kafka Connect's REST port is published on
# an ephemeral loopback port, Postgres and Kafka are reached only inside the
# compose network or through `docker compose exec`.
services:
  pg:
    image: ${PG_IMAGE:-quay.io/debezium/postgres:16}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "inventory"]
      interval: 1s
      retries: 60
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  connect:
    image: quay.io/debezium/connect:${DBZ_VERSION:-3.2}
    depends_on: [kafka, pg]
    ports:
      - "127.0.0.1::8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: capture
      CONFIG_STORAGE_TOPIC: capture_configs
      OFFSET_STORAGE_TOPIC: capture_offsets
      STATUS_STORAGE_TOPIC: capture_statuses
      # Commit offsets often, so a capture taken mid-workload sees them.
      OFFSET_FLUSH_INTERVAL_MS: 200
