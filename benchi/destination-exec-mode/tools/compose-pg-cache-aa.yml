# Tool "pg-cache-aa": Conduit v0.20.2 with the standalone postgres connector from
# ../bin/main2 (built by run.sh; main before #367, cached statements).
services:
  conduit:
    image: ghcr.io/conduitio/conduit:v0.20.2
    container_name: pgbench367-conduit
    command: ["/app/conduit", "run", "--connectors.path", "/app/connectors", "--pipelines.path", "/app/pipelines"]
    volumes:
      - ../bin/main2:/app/connectors:ro
      - ../${BENCH_PIPELINE:?set BENCH_PIPELINE}:/app/pipelines/pipeline.yml:ro
    networks:
      - benchi

networks:
  benchi:
    external: true
