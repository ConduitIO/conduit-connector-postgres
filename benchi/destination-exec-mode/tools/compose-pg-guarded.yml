# Tool "pg-guarded": Conduit v0.20.2 with the standalone postgres connector from
# ../bin/guarded (built by run.sh from GUARD_REF), with an explicit
# cache_statement URL, so the per-table schema guard (#433) is on. From v0.17.2
# the default is describe_exec again (#436), so the URL must select the mode.
services:
  conduit:
    image: ghcr.io/conduitio/conduit:v0.20.2
    container_name: pgbench367-conduit
    command: ["/app/conduit", "run", "--connectors.path", "/app/connectors", "--pipelines.path", "/app/pipelines"]
    volumes:
      - ../bin/guarded:/app/connectors:ro
      - ../${BENCH_PIPELINE_OPTOUT:?set BENCH_PIPELINE_OPTOUT}:/app/pipelines/pipeline.yml:ro
    networks:
      - benchi

networks:
  benchi:
    external: true
